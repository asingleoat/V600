# scratchndent configuration

# Active film stock name
stock = "custom_c41"

[dust_removal]
# Defect detection sensitivity (lower = more aggressive)
# ir_threshold = 0.1
# Meijering line filter threshold for hairs/scratches
# ir_hair_sensitivity = 0.1
# Minimum defect size in pixels at 800 DPI
# ir_min_area = 3
# Mask dilation in pixels at 800 DPI
# ir_dilate_radius = 4
# Morphological close in pixels at 800 DPI
# ir_close_radius = 6
# Background blur kernel in pixels at 800 DPI
# ir_blur_size = 301
# Sanity cap: max fraction of image flagged as defects
# ir_max_coverage = 0.03
# Context padding in pixels at 800 DPI
# inpaint_padding = 16

[render]
# Display curve contrast through 18% grey: 1=gentle, higher=punchier
# render_contrast = 1.8
# Low percentile for each channel's black point (white balance)
# render_percentile_lo = 0.5
# High percentile for each channel's white point (white balance)
# render_percentile_hi = 99.5
# Exposure in stops on top of automatic exposure: positive=brighter
# exposure_compensation = 0.0
# Color temperature, about half a stop per unit: positive=warmer, negative=cooler
# color_temp = 0.0
# Color tint, about half a stop per unit: positive=magenta, negative=green
# color_tint = 0.0
# Per-frame white balance from each channel's black and white points: 0=off, 1=full
# auto_white_balance = 1.0
# Film contrast: net density per decade of exposure on the straight part of its curve
# film_gamma = 0.55
# Width of the film's toe in decades of exposure
# film_toe = 0.25
# Dye crosstalk the scan sees: colour differences grow by 1 / (1 - crosstalk)
# dye_crosstalk = 0.2

