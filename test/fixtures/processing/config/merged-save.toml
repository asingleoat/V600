# scratchndent configuration

# Active film stock name
stock = "kodak_portra"

# Max preview dimension in pixels
preview_size = 8192

# Film base density [R, G, B]
dmin = [0.1, 0.2, 0.3]

# Show inverted preview instead of CLAHE
preview_inversion = true

# Enable film negative inversion
invert = false

[dust_removal]
# Defect detection sensitivity (lower = more aggressive)
ir_threshold = 0.2
# Meijering line filter threshold for hairs/scratches
# ir_hair_sensitivity = 0.1
# Minimum defect size in pixels at 800 DPI
ir_min_area = 5
# Mask dilation in pixels at 800 DPI
# ir_dilate_radius = 4
# Morphological close in pixels at 800 DPI
# ir_close_radius = 6
# Background blur kernel in pixels at 800 DPI
ir_blur_size = 151
# Sanity cap: max fraction of image flagged as defects
# ir_max_coverage = 0.03
# Context padding in pixels at 800 DPI
# inpaint_padding = 16

[render]
# S-curve contrast strength: 1.0=linear, 2.0=punchy
render_contrast = 1.6
# S-curve steepness multiplier
# render_curve_k = 5.0
# Low percentile for display range normalization
# render_percentile_lo = 0.5
# High percentile for display range normalization
# render_percentile_hi = 99.5
# Density-domain exposure shift: positive=brighter
# exposure_compensation = 0.0
# Color temperature: positive=warmer, negative=cooler
# color_temp = 0.0
# Color tint: positive=magenta, negative=green
color_tint = -0.25

